name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      # The menu bar and Bluetooth paths need a real login session, so CI only checks
      # that it compiles and starts.
      - name: Smoke test
        run: ./handover --help

      # The icon file shipped once without Info.plist referencing it, which shows up as a
      # generic app icon in Finder and nowhere else.
      - name: Check the app bundle references its icon
        run: |
          plutil -lint Resources/Info.plist
          test -f "Resources/$(plutil -extract CFBundleIconFile raw Resources/Info.plist).icns"
